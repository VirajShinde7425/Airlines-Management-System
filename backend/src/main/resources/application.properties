spring.application.name=airline-management-system

spring.datasource.url=jdbc:mysql://localhost:3306/airline_management
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

logging.level.org.springframework.security=DEBUG


# SkyWings Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SKYWINGS_EMAIL}
spring.mail.password=${SKYWINGS_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email sender
app.mail.from=${SKYWINGS_EMAIL}
app.mail.sender-name=SkyWings Airlines
